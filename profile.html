<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Planora AI Planner</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Background Blobs -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="navbar" id="navbar">
        <!-- Injected by app.js -->
    </nav>

    <main class="container fade-in" style="padding-top: 2rem; padding-bottom: 2rem; flex: 1;">
        <header style="margin-bottom: 2rem;">
            <h1>👤 Your Profile & Stats</h1>
            <p class="text-muted">Track your study progress and stay motivated.</p>
        </header>

        <div class="grid md:grid-cols-2">
            <!-- Stats & Chart Column -->
            <div class="flex-col gap-4">
                <div class="card">
                    <h3 style="margin-bottom: 1.5rem;">📊 Completion Status</h3>
                    
                    <!-- Canvas for Chart.js -->
                    <div style="width: 100%; max-width: 300px; margin: 0 auto;">
                        <canvas id="progressChart"></canvas>
                    </div>
                    
                    <div id="chart-empty-state" class="empty-state" style="display: none; padding: 2rem 0;">
                        <i class="fas fa-chart-pie" style="font-size: 2rem;"></i>
                        <p class="text-muted">No data yet 🚀 Add tasks to see stats!</p>
                    </div>
                </div>

                <div class="card" style="margin-top: 1.5rem;">
                    <h3 style="margin-bottom: 1.5rem;">📈 Progress by Priority</h3>
                    <div style="width: 100%; margin: 0 auto;">
                        <canvas id="priorityChart"></canvas>
                    </div>
                </div>

                <div class="card" style="margin-top: 1.5rem;">
                    <h3 style="margin-bottom: 1.5rem;">🔥 7-Day Activity</h3>
                    <div style="width: 100%; margin: 0 auto;">
                        <canvas id="activityChart"></canvas>
                    </div>
                </div>

                <div class="card" style="margin-top: 1.5rem;">
                    <h3 style="margin-bottom: 1.5rem;">🏆 Quick Stats</h3>
                    <ul style="list-style: none; padding: 0;">
                        <li class="flex justify-between items-center" style="padding: 0.75rem 0; border-bottom: 1px solid var(--border-color);">
                            <span class="text-muted">Tasks Created</span>
                            <strong id="total-tasks">0</strong>
                        </li>
                        <li class="flex justify-between items-center" style="padding: 0.75rem 0; border-bottom: 1px solid var(--border-color);">
                            <span class="text-muted">Tasks Completed</span>
                            <strong id="completed-tasks" style="color: var(--priority-low);">0</strong>
                        </li>
                        <li class="flex justify-between items-center" style="padding: 0.75rem 0;">
                            <span class="text-muted">Pending Tasks</span>
                            <strong id="pending-tasks" style="color: var(--priority-high);">0</strong>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Quote & Settings Column -->
            <div class="flex-col gap-4">
                <div class="card motivation-card" style="position: relative; overflow: hidden;">
                    <!-- Decorative background icon -->
                    <i class="fas fa-rocket" style="position: absolute; right: -10px; bottom: -10px; font-size: 5rem; opacity: 0.1; transform: rotate(-15deg);"></i>
                    
                    <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
                        <h3 style="margin-bottom: 0; color: rgba(255,255,255,0.9);">🚀 Motivation</h3>
                        <button id="refresh-quote" class="btn btn-outline" style="padding: 0.3rem 0.6rem; font-size: 0.75rem; border-color: rgba(255,255,255,0.3); color: white; background: rgba(255,255,255,0.1);" title="New Quote">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>

                    <div id="quote-container" style="min-height: 100px; display: flex; flex-direction: column; justify-content: center; margin-bottom: 1.5rem;">
                        <div class="loader" id="quote-loader" style="display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite;"></div>
                        <p id="quote-text" style="font-size: 1.1rem; font-style: italic; margin-bottom: 0.5rem; display: none; text-shadow: 0 1px 2px rgba(0,0,0,0.1);"></p>
                        <p id="quote-author" style="font-size: 0.9rem; color: rgba(255,255,255,0.8); text-align: right; display: none;"></p>
                    </div>

                    <div style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.1);">
                        <div class="flex justify-between items-center" style="margin-bottom: 0.5rem;">
                            <span style="font-size: 0.8rem; color: rgba(255,255,255,0.7);">STUDY STREAK</span>
                            <span id="study-streak" style="font-weight: 700; font-size: 1.1rem;">0 Days 🔥</span>
                        </div>
                        <p id="study-tip" style="font-size: 0.85rem; margin: 0; color: #fff;"></p>
                    </div>
                </div>
                
                <style>
                    @keyframes spin { to { transform: rotate(360deg); } }
                </style>

                <div class="card" style="margin-top: 1.5rem;">
                    <h3 style="margin-bottom: 1.5rem;">⚙️ Account</h3>
                    
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="profile-username" class="form-control" disabled style="opacity: 0.7;">
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Data Management</label>
                        <button id="clear-data-btn" class="btn btn-outline" style="width: 100%; color: var(--priority-high); border-color: var(--priority-high);">
                            <i class="fas fa-trash-alt"></i> Delete All My Tasks
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
