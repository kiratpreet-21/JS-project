<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Planora AI Planner</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .weekday-header {
            text-align: center;
            font-weight: 600;
            padding: 0.5rem;
            color: var(--text-muted);
        }

        .calendar-cell {
            min-height: 100px;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--card-bg);
            transition: var(--transition);
        }

        .calendar-cell:hover {
            border-color: var(--primary-color);
        }

        .calendar-cell.today {
            background: rgba(79, 70, 229, 0.05);
            border-color: var(--primary-color);
        }

        .calendar-cell.other-month {
            opacity: 0.4;
        }

        .date-number {
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
        }

        .cell-event {
            font-size: 0.75rem;
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        @media (max-width: 768px) {
            .calendar-grid {
                gap: 0.2rem;
            }

            .calendar-cell {
                padding: 0.2rem;
                min-height: 80px;
            }

            .date-number {
                font-size: 0.8rem;
                margin-bottom: 0.2rem;
            }

            .weekday-header {
                font-size: 0.8rem;
                padding: 0.2rem;
            }
        }
    </style>
</head>

<body>
    <!-- Background Blobs -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="navbar" id="navbar">
        <!-- Injected by app.js -->
    </nav>

    <main class="container fade-in" style="padding-top: 2rem; padding-bottom: 2rem; flex: 1;">
        <header style="margin-bottom: 2rem;">
            <h1>📅 Study Calendar</h1>
            <p class="text-muted">Track your upcoming exams and deadlines.</p>
        </header>

        <div class="card">
            <div class="calendar-header">
                <button id="prev-month" class="btn btn-outline" style="padding: 0.5rem 1rem;"><i
                        class="fas fa-chevron-left"></i></button>
                <h2 id="month-year-display" style="margin: 0; font-size: 1.5rem;">Month Year</h2>
                <button id="next-month" class="btn btn-outline" style="padding: 0.5rem 1rem;"><i
                        class="fas fa-chevron-right"></i></button>
            </div>

            <div class="calendar-grid">
                <div class="weekday-header">Sun</div>
                <div class="weekday-header">Mon</div>
                <div class="weekday-header">Tue</div>
                <div class="weekday-header">Wed</div>
                <div class="weekday-header">Thu</div>
                <div class="weekday-header">Fri</div>
                <div class="weekday-header">Sat</div>
            </div>
            <div class="calendar-grid" id="calendar-body">
                <!-- Generated by JS -->
            </div>

            <div class="flex justify-center gap-4" style="margin-top: 1.5rem; font-size: 0.85rem;">
                <span class="flex items-center gap-1"><span
                        style="display:inline-block; width:12px; height:12px; border-radius:3px; background:var(--priority-high)"></span>
                    Hard</span>
                <span class="flex items-center gap-1"><span
                        style="display:inline-block; width:12px; height:12px; border-radius:3px; background:var(--priority-medium)"></span>
                    Medium</span>
                <span class="flex items-center gap-1"><span
                        style="display:inline-block; width:12px; height:12px; border-radius:3px; background:var(--priority-low)"></span>
                    Easy</span>
                <span class="flex items-center gap-1"><span
                        style="display:inline-block; width:12px; height:12px; border-radius:3px; background:var(--text-muted)"></span>
                    Completed</span>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
</body>

</html>
