<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task - Planora AI Planner</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <!-- Injected by app.js -->
    </nav>

    <main class="container fade-in" style="padding-top: 2rem; padding-bottom: 2rem; flex: 1; display: flex; justify-content: center; align-items: flex-start;">
        <div class="card" style="width: 100%; max-width: 600px;">
            <div class="flex items-center gap-2" style="margin-bottom: 1.5rem;">
                <a href="index.html" class="btn btn-outline" style="padding: 0.5rem; border-color: transparent;"><i class="fas fa-arrow-left"></i></a>
                <h2 style="margin-bottom: 0;">Create New Task</h2>
            </div>
            
            <form id="add-task-form">
                <div class="form-group">
                    <label class="form-label" for="subject">Subject / Task Name</label>
                    <input type="text" id="subject" class="form-control" placeholder="e.g. Advanced Calculus Chapter 4">
                </div>
                
                <div class="grid md:grid-cols-2" style="gap: 1.5rem;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" for="difficulty">Difficulty Level (1 = Easy, 5 = Hard)</label>
                        <select id="difficulty" class="form-control">
                            <option value="1">1 - Very Easy</option>
                            <option value="2">2 - Easy</option>
                            <option value="3" selected>3 - Medium</option>
                            <option value="4">4 - Hard</option>
                            <option value="5">5 - Very Hard</option>
                        </select>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" for="examDate">Exam / Due Date</label>
                        <input type="date" id="examDate" class="form-control">
                    </div>
                </div>
                
                <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;">
                    <a href="index.html" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Task</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/add.js"></script>
</body>
</html>
