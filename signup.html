<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Planora AI Planner</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-wrapper fade-in">
        <div class="card auth-card">
            <h1 class="auth-title"><i class="fas fa-brain" style="color: var(--primary-color);"></i> Planora</h1>
            <p class="auth-subtitle">Create your account</p>
            
            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Choose a password">
    <!-- Background Blobs -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container flex justify-center items-center" style="min-height: 100vh;">
        <div class="auth-wrapper fade-in">
            <div class="card auth-card">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <h1 class="navbar-brand" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Planora</h1>
                    <p class="text-muted">🚀 Start your productivity journey today!</p>
                </div>
                
                <form id="signup-form">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Choose a username">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Choose a password">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your password">
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign Up</button>
                </form>
                
                <div style="text-align: center; margin-top: 1.5rem;">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Already have an account? <a href="login.html">Login</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
